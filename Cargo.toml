[workspace]
resolver = "3"
members = ["crates/dr-core", "crates/dr-cli", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mat8950/dwarven-realms-planner"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: DataTable rows keep the order of the table, as in the game.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev.package."*"]
opt-level = 2

# The blueprint VM is hot: keep it optimised in dev builds (`tauri dev`) too.
[profile.dev.package.dr-core]
opt-level = 3
