# Builds the installers on Windows, Linux and macOS (Apple Silicon).
# - Push a tag "v*" (for example: git tag v0.1.0 && git push origin v0.1.0): the installers are
#   attached to a draft release, to check and publish by hand.
# - Run the workflow by hand (Actions tab, or `gh workflow run release.yml -f platform=windows`): the installers
#   are only kept as workflow artifacts. `platform` builds one system only.
# The tag must match the version in app/src-tauri/tauri.conf.json and Cargo.toml.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Systems to build
        type: choice
        options: [all, windows, linux, macos]
        default: all

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          WANT: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"name": "windows-x64", "platform": "windows-latest", "rid": "win-x64", "args": ""},
            {"name": "linux-x64", "platform": "ubuntu-22.04", "rid": "linux-x64", "args": ""},
            {"name": "macos-arm64", "platform": "macos-latest", "rid": "osx-arm64", "args": "--target aarch64-apple-darwin"}
          ]'
          echo "matrix=$(jq -c --arg w "$WANT" '[.[] | select($w == "all" or (.name | startswith($w)))]' <<<"$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the UI dependencies
        working-directory: app
        run: npm ci

      # The extractor (dr-extract) goes into the installers as a Tauri sidecar.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build the extractor
        shell: bash
        run: tools/extract/build-extractor.sh ${{ matrix.rid }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Dwarven Realms Planner ${{ github.ref_name }}
          releaseBody: |
            Installers for Windows (.msi, .exe), Linux (.deb, .rpm, .AppImage) and macOS Apple Silicon (.dmg).

            The planner contains no game data. It reads the data from your own installation of Dwarven Realms.
            This project is not affiliated with or endorsed by Crater Studios.

            The installers are not signed. Windows SmartScreen asks for confirmation ("More info", then "Run anyway").
            On macOS, open the app once with right-click > Open, or run `xattr -dr com.apple.quarantine "/Applications/Dwarven Realms Planner.app"`.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
