# Builds the installers on Windows, Linux and macOS (Apple Silicon). Run it by hand (Actions tab, or gh):
#   gh workflow run release.yml -f platform=linux -f tag=v0.1.0
# - `platform` builds one system only, or all three.
# - `tag`: the installers are attached to that release (a draft is created when missing), to check and
#   publish by hand. Without it they are only kept as workflow artifacts.
# The Windows installers are usually built locally instead: tools/package/release-windows.sh --release.
# The tag must match the version in app/src-tauri/tauri.conf.json and Cargo.toml.
name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Systems to build
        type: choice
        options: [all, windows, linux, macos]
        default: all
      tag:
        description: Release to attach the installers to (for example v0.1.0); empty = artifacts only
        type: string
        default: ''

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          WANT: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"name": "windows-x64", "platform": "windows-latest", "rid": "win-x64", "args": ""},
            {"name": "linux-x64", "platform": "ubuntu-22.04", "rid": "linux-x64", "args": ""},
            {"name": "macos-arm64", "platform": "macos-latest", "rid": "osx-arm64", "args": "--target aarch64-apple-darwin"}
          ]'
          echo "matrix=$(jq -c --arg w "$WANT" '[.[] | select($w == "all" or (.name | startswith($w)))]' <<<"$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the UI dependencies
        working-directory: app
        run: npm ci

      # The extractor (dr-extract) goes into the installers as a Tauri sidecar.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build the extractor
        shell: bash
        run: tools/extract/build-extractor.sh ${{ matrix.rid }}

      # The updater artifacts (.sig) are signed with the project's key (repository secrets). latest.json is written
      # once every system is in the release: tools/package/update-manifest.sh.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag }}
          releaseName: Dwarven Realms Planner ${{ inputs.tag }}
          releaseBody: |
            Windows: download the `-setup.exe` and run it. Linux: `.AppImage` (updates itself), `.deb` or `.rpm`. macOS Apple Silicon: `.dmg`.
            Installed copies (Windows setup, AppImage, macOS app) update themselves from version 0.2.1: an "Update" button appears in the top bar.

            The planner contains no game data. It reads the data from your own installation of Dwarven Realms.
            This project is not affiliated with or endorsed by Crater Studios.

            The installers are not signed. Windows SmartScreen asks for confirmation ("More info", then "Run anyway").
            On macOS, open the app once with right-click > Open, or run `xattr -dr com.apple.quarantine "/Applications/Dwarven Realms Planner.app"`.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
