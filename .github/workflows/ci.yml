name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the UI dependencies
        working-directory: app
        run: npm ci

      - name: Check the UI types (svelte-check, tsc)
        working-directory: app
        run: npm run check

      - name: Check the translations
        working-directory: app
        run: node tests/i18n-check.mjs

      # The Tauri crate embeds the built UI, so build it before compiling.
      - name: Build the UI
        working-directory: app
        run: npm run build

      - name: Build and test the Rust workspace
        run: cargo test --workspace --locked
